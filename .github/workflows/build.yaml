name: build

on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'Platform to build'
        required: true
        type: choice
        options:
          - android
          - windows
          - linux
          - macos
      arch:
        description: 'Architecture'
        required: false
        type: choice
        options:
          - amd64
          - arm64
          - all
        default: 'all'
      env:
        description: 'Build environment'
        required: false
        type: choice
        options:
          - stable
          - pre
          - ''

env:
  IS_STABLE: ${{ !contains(github.ref, '-') }}

jobs:
  build-android:
    runs-on: ubuntu-22.04
    if: >-
      (github.event_name == 'push') ||
      (github.event.inputs.platform == 'android')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup flutter_distributor
        run: |
          rm -rf plugins/flutter_distributor
          git clone --depth 1 https://github.com/leanflutter/flutter_distributor plugins/flutter_distributor
          rm -rf plugins/flutter_distributor/.git

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android Signing
        run: |
          KEYSTORE_SECRET="${{ secrets.KEYSTORE }}"
          if [ -n "$KEYSTORE_SECRET" ]; then
            echo "$KEYSTORE_SECRET" | base64 --decode > android/app/keystore.jks
            echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> android/local.properties
            echo "storePassword=${{ secrets.STORE_PASSWORD }}" >> android/local.properties
            echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> android/local.properties
          else
            echo "No keystore secret, using debug signing"
          fi

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.0'
          cache-dependency-path: core/go.sum

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.35.7
          cache: true

      - name: Get Flutter Dependency
        run: |
          flutter --version
          flutter clean
          flutter pub get

      - name: Build
        run: |
          set -o pipefail
          export ANDROID_NDK="${ANDROID_NDK_LATEST_HOME:-${ANDROID_NDK_HOME:-${ANDROID_HOME}/ndk/$(ls -1 ${ANDROID_HOME}/ndk/ 2>/dev/null | sort -V | tail -1)}}"
          echo "ANDROID_NDK=$ANDROID_NDK"
          ENV_FLAG=""
          ARCH_FLAG=""
          if [[ "${{ github.event.inputs.env }}" == "stable" ]]; then
            ENV_FLAG="--env stable"
          elif [[ "${{ github.event.inputs.env }}" == "pre" ]]; then
            ENV_FLAG="--env pre"
          elif [[ "${{ env.IS_STABLE }}" == "true" ]]; then
            ENV_FLAG="--env stable"
          fi
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ github.event.inputs.arch }}" != "all" && "${{ github.event.inputs.arch }}" != "" ]]; then
            ARCH_FLAG="--arch ${{ github.event.inputs.arch }}"
          fi
          dart setup.dart android $ARCH_FLAG $ENV_FLAG 2>&1 | tee setup.log

      - name: Upload setup log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: setup-log
          path: setup.log

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: artifact-android-arm64-v8a
          path: ./dist
          overwrite: true

  build-windows-amd64:
    runs-on: Windows-2022
    if: >-
      (github.event_name == 'push') ||
      (github.event.inputs.platform == 'windows' && (github.event.inputs.arch == 'amd64' || github.event.inputs.arch == 'all' || github.event.inputs.arch == ''))
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup flutter_distributor
        run: |
          if (Test-Path plugins/flutter_distributor) { Remove-Item -Recurse -Force plugins/flutter_distributor }
          git clone --depth 1 https://github.com/leanflutter/flutter_distributor plugins/flutter_distributor
          Remove-Item -Recurse -Force plugins/flutter_distributor/.git

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.0'
          cache-dependency-path: core/go.sum

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.35.7
          cache: true

      - name: Get Flutter Dependency
        run: |
          flutter --version
          flutter clean
          flutter pub get

      - name: Build
        run: |
          $env:ENV_FLAG = ""
          if ("${{ github.event.inputs.env }}" -eq "stable") { $env:ENV_FLAG = "--env stable" }
          elseif ("${{ github.event.inputs.env }}" -eq "pre") { $env:ENV_FLAG = "--env pre" }
          elseif ("${{ env.IS_STABLE }}" -eq "true") { $env:ENV_FLAG = "--env stable" }
          dart setup.dart windows --arch amd64 $env:ENV_FLAG

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: artifact-windows-amd64
          path: ./dist
          overwrite: true

  build-linux-amd64:
    runs-on: ubuntu-22.04
    if: >-
      (github.event_name == 'push') ||
      (github.event.inputs.platform == 'linux' && (github.event.inputs.arch == 'amd64' || github.event.inputs.arch == 'all' || github.event.inputs.arch == ''))
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup flutter_distributor
        run: |
          rm -rf plugins/flutter_distributor
          git clone https://github.com/leanflutter/flutter_distributor plugins/flutter_distributor

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.0'
          cache-dependency-path: core/go.sum

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.35.7
          cache: true

      - name: Get Flutter Dependency
        run: |
          flutter --version
          flutter clean
          flutter pub get

      - name: Build
        run: |
          ENV_FLAG=""
          if [[ "${{ github.event.inputs.env }}" == "stable" ]]; then
            ENV_FLAG="--env stable"
          elif [[ "${{ github.event.inputs.env }}" == "pre" ]]; then
            ENV_FLAG="--env pre"
          elif [[ "${{ env.IS_STABLE }}" == "true" ]]; then
            ENV_FLAG="--env stable"
          fi
          dart setup.dart linux --arch amd64 $ENV_FLAG

      - name: Verify AppImage launcher
        shell: bash
        run: |
          set -euo pipefail
          appimage="$(find dist -type f -iname '*.appimage' | head -n 1)"
          test -n "$appimage"
          chmod +x "$appimage"
          rm -rf squashfs-root
          "$appimage" --appimage-extract >/dev/null
          test -x squashfs-root/meowclash
          grep -q 'exec "$HERE/meowclash" "$@"' squashfs-root/AppRun

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: artifact-linux-amd64
          path: ./dist
          overwrite: true

  build-linux-arm64:
    runs-on: ubuntu-24.04-arm
    if: >-
      (github.event_name == 'push') ||
      (github.event.inputs.platform == 'linux' && (github.event.inputs.arch == 'arm64' || github.event.inputs.arch == 'all' || github.event.inputs.arch == ''))
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup flutter_distributor
        run: |
          rm -rf plugins/flutter_distributor
          git clone https://github.com/leanflutter/flutter_distributor plugins/flutter_distributor

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.0'
          cache-dependency-path: core/go.sum

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: master
          flutter-version: 3.35.7
          cache: true

      - name: Get Flutter Dependency
        run: |
          flutter --version
          flutter clean
          flutter pub get

      - name: Build
        run: |
          ENV_FLAG=""
          if [[ "${{ github.event.inputs.env }}" == "stable" ]]; then
            ENV_FLAG="--env stable"
          elif [[ "${{ github.event.inputs.env }}" == "pre" ]]; then
            ENV_FLAG="--env pre"
          elif [[ "${{ env.IS_STABLE }}" == "true" ]]; then
            ENV_FLAG="--env stable"
          fi
          dart setup.dart linux --arch arm64 $ENV_FLAG

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: artifact-linux-arm64
          path: ./dist
          overwrite: true

  build-macos-amd64:
    runs-on: macos-15-intel
    if: >-
      (github.event_name == 'push') ||
      (github.event.inputs.platform == 'macos' && (github.event.inputs.arch == 'amd64' || github.event.inputs.arch == 'all' || github.event.inputs.arch == ''))
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup flutter_distributor
        run: |
          rm -rf plugins/flutter_distributor
          git clone https://github.com/leanflutter/flutter_distributor plugins/flutter_distributor

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.0'
          cache-dependency-path: core/go.sum

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.35.7
          cache: true

      - name: Get Flutter Dependency
        run: |
          flutter --version
          flutter clean
          flutter pub get

      - name: Build
        run: |
          ENV_FLAG=""
          if [[ "${{ github.event.inputs.env }}" == "stable" ]]; then
            ENV_FLAG="--env stable"
          elif [[ "${{ github.event.inputs.env }}" == "pre" ]]; then
            ENV_FLAG="--env pre"
          elif [[ "${{ env.IS_STABLE }}" == "true" ]]; then
            ENV_FLAG="--env stable"
          fi
          dart setup.dart macos --arch amd64 $ENV_FLAG

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: artifact-macos-amd64
          path: ./dist
          overwrite: true

  build-macos-arm64:
    runs-on: macos-latest
    if: >-
      (github.event_name == 'push') ||
      (github.event.inputs.platform == 'macos' && (github.event.inputs.arch == 'arm64' || github.event.inputs.arch == 'all' || github.event.inputs.arch == ''))
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup flutter_distributor
        run: |
          rm -rf plugins/flutter_distributor
          git clone https://github.com/leanflutter/flutter_distributor plugins/flutter_distributor

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.0'
          cache-dependency-path: core/go.sum

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.35.7
          cache: true

      - name: Get Flutter Dependency
        run: |
          flutter --version
          flutter clean
          flutter pub get

      - name: Build
        run: |
          ENV_FLAG=""
          if [[ "${{ github.event.inputs.env }}" == "stable" ]]; then
            ENV_FLAG="--env stable"
          elif [[ "${{ github.event.inputs.env }}" == "pre" ]]; then
            ENV_FLAG="--env pre"
          elif [[ "${{ env.IS_STABLE }}" == "true" ]]; then
            ENV_FLAG="--env stable"
          fi
          dart setup.dart macos --arch arm64 $ENV_FLAG

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: artifact-macos-arm64
          path: ./dist
          overwrite: true

  upload:
    permissions: write-all
    needs: [ build-android, build-windows-amd64, build-linux-amd64, build-linux-arm64, build-macos-amd64, build-macos-arm64 ]
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download
        uses: actions/download-artifact@v4
        with:
          path: ./dist/
          pattern: artifact-*
          merge-multiple: true

      - name: Generate release.md
        run: |
          version=$(echo "${{ github.ref_name }}" | sed 's/^v//')
          sed "s|VERSION|$version|g" ./.github/release_template.md > release.md

      - name: Rename release assets
        run: |
          version=$(echo "${{ github.ref_name }}" | sed 's/^v//')
          cd ./dist
          find . -type f -not -name "*.sha256" | while read -r filepath; do
            filename=$(basename "$filepath" | tr '[:upper:]' '[:lower:]')
            ext=".${filepath##*.}"
            if [[ "$filename" == *.tar.gz ]]; then
              ext=".tar.gz"
            fi
            new_name=""
            
            if [[ "$filename" == *"android"* ]]; then
              if [[ "$filename" == *"arm64"* || "$filename" == *"arm64-v8a"* ]]; then
                new_name="MeowClash-${version}-android-arm64-v8a${ext}"
              elif [[ "$filename" == *"armeabi-v7a"* || "$filename" == *"armv7"* || "$filename" == *"android-arm"* ]]; then
                new_name="MeowClash-${version}-android-armeabi-v7a${ext}"
              elif [[ "$filename" == *"x86_64"* || "$filename" == *"x64"* || "$filename" == *"x86-64"* ]]; then
                new_name="MeowClash-${version}-android-x86_64${ext}"
              else
                new_name="MeowClash-${version}-android${ext}"
              fi
            elif [[ "$filename" == *"windows"* ]]; then
              if [[ "$filename" == *"setup.exe" ]]; then
                new_name="MeowClash-${version}-windows-amd64-setup.exe"
              elif [[ "$filename" == *".zip" ]]; then
                new_name="MeowClash-${version}-windows-amd64.zip"
              fi
            elif [[ "$filename" == *"macos"* || "$filename" == *"darwin"* ]]; then
              if [[ "$filename" == *"arm64"* ]]; then
                new_name="MeowClash-${version}-macos-arm64${ext}"
              elif [[ "$filename" == *"amd64"* || "$filename" == *"x64"* || "$filename" == *"x86_64"* ]]; then
                new_name="MeowClash-${version}-macos-amd64${ext}"
              fi
            elif [[ "$filename" == *"linux"* ]]; then
              if [[ "$filename" == *"arm64"* ]]; then
                if [[ "$filename" == *"portable"* || "$filename" == *.tar.gz ]]; then
                  new_name="MeowClash-${version}-linux-arm64-portable.tar.gz"
                else
                  new_name="MeowClash-${version}-linux-arm64${ext}"
                fi
              elif [[ "$filename" == *"amd64"* || "$filename" == *"x64"* || "$filename" == *"x86_64"* ]]; then
                if [[ "$filename" == *"portable"* || "$filename" == *.tar.gz ]]; then
                  new_name="MeowClash-${version}-linux-amd64-portable.tar.gz"
                elif [[ "$filename" == *".appimage" ]]; then
                  new_name="MeowClash-${version}-linux-amd64.AppImage"
                elif [[ "$filename" == *".deb" ]]; then
                  new_name="MeowClash-${version}-linux-amd64.deb"
                elif [[ "$filename" == *".rpm" ]]; then
                  new_name="MeowClash-${version}-linux-amd64.rpm"
                else
                  new_name="MeowClash-${version}-linux-amd64${ext}"
                fi
              fi
            fi
            
            if [ -n "$new_name" ]; then
              if [ "$filepath" != "./$new_name" ]; then
                echo "Renaming/moving: $filepath -> ./$new_name"
                mv "$filepath" "./$new_name"
              else
                echo "File is already named correctly: $new_name"
              fi
            else
              echo "Warning: Could not determine target filename pattern for: $filepath"
            fi
          done
          find . -type d -empty -delete

      - name: Generate sha256
        if: env.IS_STABLE == 'true'
        run: |
          cd ./dist
          find . -type f -not -name "*.sha256" -print0 | while IFS= read -r -d '' file; do
            sha256sum "$file" > "${file}.sha256"
          done  

      - name: Release
        if: ${{ env.IS_STABLE == 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          files: ./dist/**/*
          body_path: './release.md'
