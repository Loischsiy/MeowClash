name: release all platforms
run-name: Release ${{ inputs.version }} (${{ inputs.app_env }})

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version, for example 1.0.0'
        required: true
        type: string
      app_env:
        description: 'Application environment'
        required: true
        type: choice
        options:
          - stable
          - pre
        default: stable

permissions:
  contents: write

concurrency:
  group: release-all-${{ github.event.inputs.version }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      app_version: ${{ steps.version.outputs.app_version }}
      pubspec_version: ${{ steps.version.outputs.pubspec_version }}
      release_tag: ${{ steps.version.outputs.release_tag }}
    steps:
      - name: Normalize release version
        id: version
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          version="${INPUT_VERSION#v}"

          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version must look like 1.0.0"
            exit 1
          fi

          build_number="$(date -u +%Y%m%d%H)"
          echo "app_version=$version" >> "$GITHUB_OUTPUT"
          echo "pubspec_version=$version+$build_number" >> "$GITHUB_OUTPUT"
          echo "release_tag=v$version" >> "$GITHUB_OUTPUT"

  build-android:
    needs: prepare
    runs-on: ubuntu-22.04
    env:
      APP_ENV: ${{ inputs.app_env }}
      PUBSPEC_VERSION: ${{ needs.prepare.outputs.pubspec_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch app version
        shell: bash
        run: |
          set -euo pipefail
          sed -i.bak -E "s/^version: .*/version: ${PUBSPEC_VERSION}/" pubspec.yaml
          rm -f pubspec.yaml.bak
          grep '^version:' pubspec.yaml

      - name: Setup flutter_distributor
        shell: bash
        run: |
          set -euo pipefail
          rm -rf plugins/flutter_distributor
          git clone --depth 1 https://github.com/leanflutter/flutter_distributor plugins/flutter_distributor
          rm -rf plugins/flutter_distributor/.git

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android Signing
        shell: bash
        env:
          KEYSTORE_SECRET: ${{ secrets.KEYSTORE }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -n "${KEYSTORE_SECRET:-}" ]; then
            echo "$KEYSTORE_SECRET" | base64 --decode > android/app/keystore.jks
            echo "keyAlias=$KEY_ALIAS" >> android/local.properties
            echo "storePassword=$STORE_PASSWORD" >> android/local.properties
            echo "keyPassword=$KEY_PASSWORD" >> android/local.properties
          else
            echo "No keystore secret, using debug signing"
          fi

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.0'
          cache-dependency-path: core/go.sum

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.35.7
          cache: true

      - name: Get Flutter Dependency
        shell: bash
        run: |
          set -euo pipefail
          flutter --version
          flutter clean
          flutter pub get

      - name: Build
        shell: bash
        run: |
          set -euo pipefail
          set -o pipefail
          export ANDROID_NDK="${ANDROID_NDK_LATEST_HOME:-${ANDROID_NDK_HOME:-${ANDROID_HOME}/ndk/$(ls -1 "${ANDROID_HOME}/ndk/" 2>/dev/null | sort -V | tail -1)}}"
          echo "ANDROID_NDK=$ANDROID_NDK"
          dart setup.dart android --env "$APP_ENV" 2>&1 | tee setup.log

      - name: Upload setup log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: setup-log-android
          path: setup.log

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-android
          path: ./dist
          overwrite: true

  build-windows-amd64:
    needs: prepare
    runs-on: windows-2022
    env:
      APP_ENV: ${{ inputs.app_env }}
      PUBSPEC_VERSION: ${{ needs.prepare.outputs.pubspec_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch app version
        shell: bash
        run: |
          set -euo pipefail
          sed -i.bak -E "s/^version: .*/version: ${PUBSPEC_VERSION}/" pubspec.yaml
          rm -f pubspec.yaml.bak
          grep '^version:' pubspec.yaml

      - name: Setup flutter_distributor
        shell: bash
        run: |
          set -euo pipefail
          rm -rf plugins/flutter_distributor
          git clone --depth 1 https://github.com/leanflutter/flutter_distributor plugins/flutter_distributor
          rm -rf plugins/flutter_distributor/.git

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.0'
          cache-dependency-path: core/go.sum

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.35.7
          cache: true

      - name: Get Flutter Dependency
        shell: bash
        run: |
          set -euo pipefail
          flutter --version
          flutter clean
          flutter pub get

      - name: Build
        shell: bash
        run: |
          set -euo pipefail
          set -o pipefail
          dart setup.dart windows --arch amd64 --env "$APP_ENV" 2>&1 | tee setup.log

      - name: Upload setup log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: setup-log-windows-amd64
          path: setup.log

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-windows-amd64
          path: ./dist
          overwrite: true

  build-linux-amd64:
    needs: prepare
    runs-on: ubuntu-22.04
    env:
      APP_ENV: ${{ inputs.app_env }}
      PUBSPEC_VERSION: ${{ needs.prepare.outputs.pubspec_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch app version
        shell: bash
        run: |
          set -euo pipefail
          sed -i.bak -E "s/^version: .*/version: ${PUBSPEC_VERSION}/" pubspec.yaml
          rm -f pubspec.yaml.bak
          grep '^version:' pubspec.yaml

      - name: Setup flutter_distributor
        shell: bash
        run: |
          set -euo pipefail
          rm -rf plugins/flutter_distributor
          git clone --depth 1 https://github.com/leanflutter/flutter_distributor plugins/flutter_distributor
          rm -rf plugins/flutter_distributor/.git

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.0'
          cache-dependency-path: core/go.sum

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.35.7
          cache: true

      - name: Get Flutter Dependency
        shell: bash
        run: |
          set -euo pipefail
          flutter --version
          flutter clean
          flutter pub get

      - name: Build
        shell: bash
        run: |
          set -euo pipefail
          set -o pipefail
          dart setup.dart linux --arch amd64 --env "$APP_ENV" 2>&1 | tee setup.log

      - name: Verify AppImage launcher
        shell: bash
        run: |
          set -euo pipefail
          appimage="$(find dist -type f -iname '*.appimage' | head -n 1)"
          test -n "$appimage"
          chmod +x "$appimage"
          rm -rf squashfs-root
          "$appimage" --appimage-extract >/dev/null
          test -x squashfs-root/meowclash
          grep -q 'exec "$HERE/meowclash" "$@"' squashfs-root/AppRun

      - name: Upload setup log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: setup-log-linux-amd64
          path: setup.log

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-linux-amd64
          path: ./dist
          overwrite: true

  build-linux-arm64:
    needs: prepare
    runs-on: ubuntu-24.04-arm
    env:
      APP_ENV: ${{ inputs.app_env }}
      PUBSPEC_VERSION: ${{ needs.prepare.outputs.pubspec_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch app version
        shell: bash
        run: |
          set -euo pipefail
          sed -i.bak -E "s/^version: .*/version: ${PUBSPEC_VERSION}/" pubspec.yaml
          rm -f pubspec.yaml.bak
          grep '^version:' pubspec.yaml

      - name: Setup flutter_distributor
        shell: bash
        run: |
          set -euo pipefail
          rm -rf plugins/flutter_distributor
          git clone --depth 1 https://github.com/leanflutter/flutter_distributor plugins/flutter_distributor
          rm -rf plugins/flutter_distributor/.git

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.0'
          cache-dependency-path: core/go.sum

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: master
          flutter-version: 3.35.7
          cache: true

      - name: Get Flutter Dependency
        shell: bash
        run: |
          set -euo pipefail
          flutter --version
          flutter clean
          flutter pub get

      - name: Build
        shell: bash
        run: |
          set -euo pipefail
          set -o pipefail
          dart setup.dart linux --arch arm64 --env "$APP_ENV" 2>&1 | tee setup.log

      - name: Upload setup log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: setup-log-linux-arm64
          path: setup.log

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-linux-arm64
          path: ./dist
          overwrite: true

  build-macos-amd64:
    needs: prepare
    runs-on: macos-15-intel
    env:
      APP_ENV: ${{ inputs.app_env }}
      PUBSPEC_VERSION: ${{ needs.prepare.outputs.pubspec_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch app version
        shell: bash
        run: |
          set -euo pipefail
          sed -i.bak -E "s/^version: .*/version: ${PUBSPEC_VERSION}/" pubspec.yaml
          rm -f pubspec.yaml.bak
          grep '^version:' pubspec.yaml

      - name: Setup flutter_distributor
        shell: bash
        run: |
          set -euo pipefail
          rm -rf plugins/flutter_distributor
          git clone --depth 1 https://github.com/leanflutter/flutter_distributor plugins/flutter_distributor
          rm -rf plugins/flutter_distributor/.git

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.0'
          cache-dependency-path: core/go.sum

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.35.7
          cache: true

      - name: Get Flutter Dependency
        shell: bash
        run: |
          set -euo pipefail
          flutter --version
          flutter clean
          flutter pub get

      - name: Build
        shell: bash
        run: |
          set -euo pipefail
          set -o pipefail
          dart setup.dart macos --arch amd64 --env "$APP_ENV" 2>&1 | tee setup.log

      - name: Upload setup log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: setup-log-macos-amd64
          path: setup.log

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-macos-amd64
          path: ./dist
          overwrite: true

  build-macos-arm64:
    needs: prepare
    runs-on: macos-latest
    env:
      APP_ENV: ${{ inputs.app_env }}
      PUBSPEC_VERSION: ${{ needs.prepare.outputs.pubspec_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch app version
        shell: bash
        run: |
          set -euo pipefail
          sed -i.bak -E "s/^version: .*/version: ${PUBSPEC_VERSION}/" pubspec.yaml
          rm -f pubspec.yaml.bak
          grep '^version:' pubspec.yaml

      - name: Setup flutter_distributor
        shell: bash
        run: |
          set -euo pipefail
          rm -rf plugins/flutter_distributor
          git clone --depth 1 https://github.com/leanflutter/flutter_distributor plugins/flutter_distributor
          rm -rf plugins/flutter_distributor/.git

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.0'
          cache-dependency-path: core/go.sum

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.35.7
          cache: true

      - name: Get Flutter Dependency
        shell: bash
        run: |
          set -euo pipefail
          flutter --version
          flutter clean
          flutter pub get

      - name: Build
        shell: bash
        run: |
          set -euo pipefail
          set -o pipefail
          dart setup.dart macos --arch arm64 --env "$APP_ENV" 2>&1 | tee setup.log

      - name: Upload setup log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: setup-log-macos-arm64
          path: setup.log

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-macos-arm64
          path: ./dist
          overwrite: true

  publish-release:
    needs:
      - prepare
      - build-android
      - build-windows-amd64
      - build-linux-amd64
      - build-linux-arm64
      - build-macos-amd64
      - build-macos-arm64
    runs-on: ubuntu-latest
    env:
      APP_VERSION: ${{ needs.prepare.outputs.app_version }}
      RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./dist
          pattern: release-*
          merge-multiple: true

      - name: Generate release notes
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "Release $RELEASE_TAG"
            echo
            echo "Built from $GITHUB_SHA."
            echo
            sed "s|VERSION|$APP_VERSION|g" ./.github/release_template.md
          } > release.md

      - name: Rename release assets
        shell: bash
        run: |
          set -euo pipefail
          version="$APP_VERSION"
          cd ./dist
          find . -type f -not -name "*.sha256" | while read -r filepath; do
            filename=$(basename "$filepath" | tr '[:upper:]' '[:lower:]')
            ext=".${filepath##*.}"
            if [[ "$filename" == *.tar.gz ]]; then
              ext=".tar.gz"
            fi
            new_name=""
            
            if [[ "$filename" == *"android"* ]]; then
              if [[ "$filename" == *"arm64"* || "$filename" == *"arm64-v8a"* ]]; then
                new_name="MeowClash-${version}-android-arm64-v8a${ext}"
              elif [[ "$filename" == *"armeabi-v7a"* || "$filename" == *"armv7"* || "$filename" == *"android-arm"* ]]; then
                new_name="MeowClash-${version}-android-armeabi-v7a${ext}"
              elif [[ "$filename" == *"x86_64"* || "$filename" == *"x64"* || "$filename" == *"x86-64"* ]]; then
                new_name="MeowClash-${version}-android-x86_64${ext}"
              else
                new_name="MeowClash-${version}-android${ext}"
              fi
            elif [[ "$filename" == *"windows"* ]]; then
              if [[ "$filename" == *"setup.exe" ]]; then
                new_name="MeowClash-${version}-windows-amd64-setup.exe"
              elif [[ "$filename" == *".zip" ]]; then
                new_name="MeowClash-${version}-windows-amd64.zip"
              fi
            elif [[ "$filename" == *"macos"* || "$filename" == *"darwin"* ]]; then
              if [[ "$filename" == *"arm64"* ]]; then
                new_name="MeowClash-${version}-macos-arm64${ext}"
              elif [[ "$filename" == *"amd64"* || "$filename" == *"x64"* || "$filename" == *"x86_64"* ]]; then
                new_name="MeowClash-${version}-macos-amd64${ext}"
              fi
            elif [[ "$filename" == *"linux"* ]]; then
              if [[ "$filename" == *"arm64"* ]]; then
                if [[ "$filename" == *"portable"* || "$filename" == *.tar.gz ]]; then
                  new_name="MeowClash-${version}-linux-arm64-portable.tar.gz"
                else
                  new_name="MeowClash-${version}-linux-arm64${ext}"
                fi
              elif [[ "$filename" == *"amd64"* || "$filename" == *"x64"* || "$filename" == *"x86_64"* ]]; then
                if [[ "$filename" == *"portable"* || "$filename" == *.tar.gz ]]; then
                  new_name="MeowClash-${version}-linux-amd64-portable.tar.gz"
                elif [[ "$filename" == *".appimage" ]]; then
                  new_name="MeowClash-${version}-linux-amd64.AppImage"
                elif [[ "$filename" == *".deb" ]]; then
                  new_name="MeowClash-${version}-linux-amd64.deb"
                elif [[ "$filename" == *".rpm" ]]; then
                  new_name="MeowClash-${version}-linux-amd64.rpm"
                else
                  new_name="MeowClash-${version}-linux-amd64${ext}"
                fi
              fi
            fi
            
            if [ -n "$new_name" ]; then
              if [ "$filepath" != "./$new_name" ]; then
                echo "Renaming/moving: $filepath -> ./$new_name"
                mv "$filepath" "./$new_name"
              else
                echo "File is already named correctly: $new_name"
              fi
            else
              echo "Warning: Could not determine target filename pattern for: $filepath"
            fi
          done
          find . -type d -empty -delete

      - name: Generate sha256
        shell: bash
        run: |
          set -euo pipefail
          cd ./dist
          find . -type f -not -name "*.sha256" -print0 | while IFS= read -r -d '' file; do
            sha256sum "$file" > "${file}.sha256"
          done

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.release_tag }}
          name: MeowClash ${{ needs.prepare.outputs.release_tag }}
          target_commitish: ${{ github.sha }}
          files: ./dist/**/*
          body_path: ./release.md
          prerelease: ${{ inputs.app_env != 'stable' }}
          fail_on_unmatched_files: true
          overwrite_files: true

      - name: Publish GitLab release
        shell: bash
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
          GITLAB_PROJECT: ${{ vars.GITLAB_PROJECT || 'Loischsiy/MeowClash' }}
          GITLAB_REF: ${{ vars.GITLAB_REF || 'main' }}
        run: |
          set -euo pipefail
          : "${GITLAB_TOKEN:?Set GITLAB_TOKEN secret}"

          project="$(jq -rn --arg v "$GITLAB_PROJECT" '$v|@uri')"
          api="https://gitlab.com/api/v4/projects/$project"
          links_file="$(mktemp)"
          : > "$links_file"

          find ./dist -type f -print0 | sort -z | while IFS= read -r -d '' file; do
            name="$(basename "$file")"
            url="https://github.com/$GITHUB_REPOSITORY/releases/download/$RELEASE_TAG/$name"
            jq -n --arg name "$name" --arg url "$url" \
              '{name: $name, url: $url, link_type: "other"}' >> "$links_file"
          done

          links="$(jq -s . "$links_file")"
          jq -n \
            --arg name "MeowClash $RELEASE_TAG" \
            --arg tag "$RELEASE_TAG" \
            --arg ref "$GITLAB_REF" \
            --rawfile description release.md \
            --argjson links "$links" \
            '{name: $name, tag_name: $tag, ref: $ref, description: $description, assets: {links: $links}}' \
            > gitlab-release.json

          status="$(curl --silent --output gitlab-response.json --write-out "%{http_code}" \
            --request POST \
            --header "Content-Type: application/json" \
            --header "PRIVATE-TOKEN: $GITLAB_TOKEN" \
            --data @gitlab-release.json \
            "$api/releases")"

          if [ "$status" = "409" ]; then
            curl --fail --request DELETE --header "PRIVATE-TOKEN: $GITLAB_TOKEN" "$api/releases/$RELEASE_TAG"
            curl --fail --request POST \
              --header "Content-Type: application/json" \
              --header "PRIVATE-TOKEN: $GITLAB_TOKEN" \
              --data @gitlab-release.json \
              "$api/releases"
          elif [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            cat gitlab-response.json
            exit 1
          fi

      - name: Publish GitVerse release
        shell: bash
        env:
          GITVERSE_TOKEN: ${{ secrets.GITVERSE_TOKEN }}
          GITVERSE_REPOSITORY: ${{ vars.GITVERSE_REPOSITORY || 'Loischsiy/MeowClash' }}
          GITVERSE_REF: ${{ vars.GITVERSE_REF || 'main' }}
          PRERELEASE: ${{ inputs.app_env != 'stable' }}
        run: |
          set -euo pipefail
          : "${GITVERSE_TOKEN:?Set GITVERSE_TOKEN secret}"

          api="https://gitverse.ru/api/repos/$GITVERSE_REPOSITORY"
          auth_header="Authorization: token $GITVERSE_TOKEN"
          gitverse_headers=(
            --header "Accept: application/json"
            --header "User-Agent: MeowClash release workflow"
            --header "$auth_header"
          )
          curl --silent --fail --request DELETE \
            "${gitverse_headers[@]}" \
            "$api/releases/tags/$RELEASE_TAG" >/dev/null || true

          jq -n \
            --arg name "MeowClash $RELEASE_TAG" \
            --arg tag "$RELEASE_TAG" \
            --arg target "$GITVERSE_REF" \
            --rawfile body release.md \
            --argjson prerelease "$PRERELEASE" \
            '{name: $name, tag_name: $tag, target_commitish: $target, body: $body, prerelease: $prerelease, draft: false}' \
            > gitverse-release.json

          status="$(curl --silent --show-error --output gitverse-response.json --write-out "%{http_code}" \
            --request POST \
            --header "Content-Type: application/json" \
            "${gitverse_headers[@]}" \
            --data @gitverse-release.json \
            "$api/releases")"

          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            cat gitverse-response.json
            exit 1
          fi

          release_id="$(jq -r '.id' gitverse-response.json)"
          test -n "$release_id"
          test "$release_id" != "null"

          find ./dist -type f -print0 | sort -z | while IFS= read -r -d '' file; do
            name="$(basename "$file")"
            asset_name="$(jq -rn --arg v "$name" '$v|@uri')"
            curl --fail --request POST \
              "${gitverse_headers[@]}" \
              --form "attachment=@$file" \
              "$api/releases/$release_id/assets?name=$asset_name"
          done
