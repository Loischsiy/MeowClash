name: build

on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'Platform to build'
        required: true
        type: choice
        options:
          - android
          - windows
          - linux
          - macos
          - ios
      arch:
        description: 'Architecture'
        required: false
        type: choice
        options:
          - amd64
          - arm64
          - all
        default: 'all'
      env:
        description: 'Build environment'
        required: false
        type: choice
        options:
          - stable
          - pre
          - ''

env:
  IS_STABLE: ${{ !contains(github.ref, '-') }}

jobs:
  build-android:
    runs-on: ubuntu-22.04
    if: >-
      (github.event_name == 'push') ||
      (github.event.inputs.platform == 'android')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup flutter_distributor
        run: |
          rm -rf plugins/flutter_distributor
          git clone --depth 1 https://github.com/leanflutter/flutter_distributor plugins/flutter_distributor
          rm -rf plugins/flutter_distributor/.git

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android Signing
        run: |
          KEYSTORE_SECRET="${{ secrets.KEYSTORE }}"
          if [ -n "$KEYSTORE_SECRET" ]; then
            echo "$KEYSTORE_SECRET" | base64 --decode > android/app/keystore.jks
            echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> android/local.properties
            echo "storePassword=${{ secrets.STORE_PASSWORD }}" >> android/local.properties
            echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> android/local.properties
          else
            echo "No keystore secret, using debug signing"
          fi

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.0'
          cache-dependency-path: core/go.sum

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.35.7
          cache: true

      - name: Get Flutter Dependency
        run: |
          flutter --version
          flutter clean
          flutter pub get

      - name: Build
        run: |
          set -o pipefail
          export ANDROID_NDK="${ANDROID_NDK_LATEST_HOME:-${ANDROID_NDK_HOME:-${ANDROID_HOME}/ndk/$(ls -1 ${ANDROID_HOME}/ndk/ 2>/dev/null | sort -V | tail -1)}}"
          echo "ANDROID_NDK=$ANDROID_NDK"
          ENV_FLAG=""
          ARCH_FLAG=""
          if [[ "${{ github.event.inputs.env }}" == "stable" ]]; then
            ENV_FLAG="--env stable"
          elif [[ "${{ github.event.inputs.env }}" == "pre" ]]; then
            ENV_FLAG="--env pre"
          elif [[ "${{ env.IS_STABLE }}" == "true" ]]; then
            ENV_FLAG="--env stable"
          fi
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ github.event.inputs.arch }}" != "all" && "${{ github.event.inputs.arch }}" != "" ]]; then
            ARCH_FLAG="--arch ${{ github.event.inputs.arch }}"
          fi
          dart setup.dart android $ARCH_FLAG $ENV_FLAG 2>&1 | tee setup.log

      - name: Upload setup log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: setup-log
          path: setup.log

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: artifact-android
          path: ./dist
          overwrite: true

  build-windows-amd64:
    runs-on: Windows-2022
    if: >-
      (github.event_name == 'push') ||
      (github.event.inputs.platform == 'windows' && (github.event.inputs.arch == 'amd64' || github.event.inputs.arch == 'all' || github.event.inputs.arch == ''))
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup flutter_distributor
        run: |
          if (Test-Path plugins/flutter_distributor) { Remove-Item -Recurse -Force plugins/flutter_distributor }
          git clone --depth 1 https://github.com/leanflutter/flutter_distributor plugins/flutter_distributor
          Remove-Item -Recurse -Force plugins/flutter_distributor/.git

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.0'
          cache-dependency-path: core/go.sum

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.35.7
          cache: true

      - name: Get Flutter Dependency
        run: |
          flutter --version
          flutter clean
          flutter pub get

      - name: Build
        run: |
          $envFlag = @()
          if ("${{ github.event.inputs.env }}" -eq "stable") { $envFlag = @("--env", "stable") }
          elseif ("${{ github.event.inputs.env }}" -eq "pre") { $envFlag = @("--env", "pre") }
          elseif ("${{ env.IS_STABLE }}" -eq "true") { $envFlag = @("--env", "stable") }
          dart setup.dart windows --arch amd64 @envFlag

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: artifact-windows-amd64
          path: ./dist
          overwrite: true

  build-windows-arm64:
    runs-on: windows-11-arm
    if: >-
      (github.event_name == 'push') ||
      (github.event.inputs.platform == 'windows' && (github.event.inputs.arch == 'arm64' || github.event.inputs.arch == 'all' || github.event.inputs.arch == ''))
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup flutter_distributor
        run: |
          if (Test-Path plugins/flutter_distributor) { Remove-Item -Recurse -Force plugins/flutter_distributor }
          git clone --depth 1 https://github.com/leanflutter/flutter_distributor plugins/flutter_distributor
          Remove-Item -Recurse -Force plugins/flutter_distributor/.git

      - name: Setup native ARM64 Rust and installer
        shell: pwsh
        run: |
          Invoke-WebRequest https://win.rustup.rs/aarch64 -OutFile "$env:RUNNER_TEMP/rustup-init.exe"
          & "$env:RUNNER_TEMP/rustup-init.exe" -y --profile minimal --default-toolchain stable
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "$env:USERPROFILE\.cargo\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          choco install innosetup --yes --no-progress
          if ($LASTEXITCODE -notin @(0, 1641, 3010)) { exit $LASTEXITCODE }

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.0'
          cache-dependency-path: core/go.sum

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: master
          flutter-version: 3.44.1
          cache: true

      - name: Get Flutter Dependency
        run: |
          flutter --version
          flutter clean
          flutter pub get

      - name: Build
        run: |
          $envFlag = @()
          if ("${{ github.event.inputs.env }}" -eq "stable") { $envFlag = @("--env", "stable") }
          elseif ("${{ github.event.inputs.env }}" -eq "pre") { $envFlag = @("--env", "pre") }
          elseif ("${{ env.IS_STABLE }}" -eq "true") { $envFlag = @("--env", "stable") }
          dart setup.dart windows --arch arm64 @envFlag

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: artifact-windows-arm64
          path: ./dist
          overwrite: true

  build-linux-amd64:
    runs-on: ubuntu-22.04
    if: >-
      (github.event_name == 'push') ||
      (github.event.inputs.platform == 'linux' && (github.event.inputs.arch == 'amd64' || github.event.inputs.arch == 'all' || github.event.inputs.arch == ''))
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup flutter_distributor
        run: |
          rm -rf plugins/flutter_distributor
          git clone https://github.com/leanflutter/flutter_distributor plugins/flutter_distributor

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.0'
          cache-dependency-path: core/go.sum

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.35.7
          cache: true

      - name: Get Flutter Dependency
        run: |
          flutter --version
          flutter clean
          flutter pub get

      - name: Build
        run: |
          ENV_FLAG=""
          if [[ "${{ github.event.inputs.env }}" == "stable" ]]; then
            ENV_FLAG="--env stable"
          elif [[ "${{ github.event.inputs.env }}" == "pre" ]]; then
            ENV_FLAG="--env pre"
          elif [[ "${{ env.IS_STABLE }}" == "true" ]]; then
            ENV_FLAG="--env stable"
          fi
          dart setup.dart linux --arch amd64 $ENV_FLAG

      - name: Verify AppImage launcher
        shell: bash
        run: |
          set -euo pipefail
          appimage="$(find dist -type f -iname '*.appimage' | head -n 1)"
          test -n "$appimage"
          chmod +x "$appimage"
          rm -rf squashfs-root
          "$appimage" --appimage-extract >/dev/null
          test -x squashfs-root/meowclash
          grep -q 'exec "$HERE/meowclash" "$@"' squashfs-root/AppRun

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: artifact-linux-amd64
          path: ./dist
          overwrite: true

  build-linux-arm64:
    runs-on: ubuntu-24.04-arm
    if: >-
      (github.event_name == 'push') ||
      (github.event.inputs.platform == 'linux' && (github.event.inputs.arch == 'arm64' || github.event.inputs.arch == 'all' || github.event.inputs.arch == ''))
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup flutter_distributor
        run: |
          rm -rf plugins/flutter_distributor
          git clone https://github.com/leanflutter/flutter_distributor plugins/flutter_distributor

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.0'
          cache-dependency-path: core/go.sum

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: master
          flutter-version: 3.35.7
          cache: true

      - name: Get Flutter Dependency
        run: |
          flutter --version
          flutter clean
          flutter pub get

      - name: Build
        run: |
          ENV_FLAG=""
          if [[ "${{ github.event.inputs.env }}" == "stable" ]]; then
            ENV_FLAG="--env stable"
          elif [[ "${{ github.event.inputs.env }}" == "pre" ]]; then
            ENV_FLAG="--env pre"
          elif [[ "${{ env.IS_STABLE }}" == "true" ]]; then
            ENV_FLAG="--env stable"
          fi
          dart setup.dart linux --arch arm64 $ENV_FLAG

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: artifact-linux-arm64
          path: ./dist
          overwrite: true

  build-macos-amd64:
    runs-on: macos-15-intel
    if: >-
      (github.event_name == 'push') ||
      (github.event.inputs.platform == 'macos' && (github.event.inputs.arch == 'amd64' || github.event.inputs.arch == 'all' || github.event.inputs.arch == ''))
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup flutter_distributor
        run: |
          rm -rf plugins/flutter_distributor
          git clone https://github.com/leanflutter/flutter_distributor plugins/flutter_distributor

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.0'
          cache-dependency-path: core/go.sum

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.35.7
          cache: true

      - name: Get Flutter Dependency
        run: |
          flutter --version
          flutter clean
          flutter pub get

      - name: Build
        run: |
          ENV_FLAG=""
          if [[ "${{ github.event.inputs.env }}" == "stable" ]]; then
            ENV_FLAG="--env stable"
          elif [[ "${{ github.event.inputs.env }}" == "pre" ]]; then
            ENV_FLAG="--env pre"
          elif [[ "${{ env.IS_STABLE }}" == "true" ]]; then
            ENV_FLAG="--env stable"
          fi
          dart setup.dart macos --arch amd64 $ENV_FLAG

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: artifact-macos-amd64
          path: ./dist
          overwrite: true

  build-macos-arm64:
    runs-on: macos-latest
    if: >-
      (github.event_name == 'push') ||
      (github.event.inputs.platform == 'macos' && (github.event.inputs.arch == 'arm64' || github.event.inputs.arch == 'all' || github.event.inputs.arch == ''))
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup flutter_distributor
        run: |
          rm -rf plugins/flutter_distributor
          git clone https://github.com/leanflutter/flutter_distributor plugins/flutter_distributor

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.0'
          cache-dependency-path: core/go.sum

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.35.7
          cache: true

      - name: Get Flutter Dependency
        run: |
          flutter --version
          flutter clean
          flutter pub get

      - name: Build
        run: |
          ENV_FLAG=""
          if [[ "${{ github.event.inputs.env }}" == "stable" ]]; then
            ENV_FLAG="--env stable"
          elif [[ "${{ github.event.inputs.env }}" == "pre" ]]; then
            ENV_FLAG="--env pre"
          elif [[ "${{ env.IS_STABLE }}" == "true" ]]; then
            ENV_FLAG="--env stable"
          fi
          dart setup.dart macos --arch arm64 $ENV_FLAG

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: artifact-macos-arm64
          path: ./dist
          overwrite: true

  build-ios-arm64:
    runs-on: macos-15
    if: github.event.inputs.platform == 'ios' && (github.event.inputs.arch == 'arm64' || github.event.inputs.arch == 'all' || github.event.inputs.arch == '')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.0'
          cache-dependency-path: core/go.sum
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.1
          cache: true
      - name: Prepare iOS dependencies
        run: |
          xcodebuild -version
          flutter pub get
      - name: Build unsigned iOS device app
        shell: bash
        env:
          APP_ENV: ${{ inputs.env || 'pre' }}
        run: |
          set -euo pipefail
          dart setup.dart ios --arch arm64 --env "$APP_ENV" 2>&1 | tee setup-ios.log
          test -d build/ios/iphoneos/Runner.app/PlugIns/PacketTunnel.appex
          file build/ios/iphoneos/Runner.app/PlugIns/PacketTunnel.appex/PacketTunnel
      - uses: actions/upload-artifact@v4
        with:
          name: artifact-ios-arm64-unsigned
          path: dist/*.ipa
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: setup-log-ios
          path: setup-ios.log

  upload:
    permissions: write-all
    needs: [ build-android, build-windows-amd64, build-windows-arm64, build-ios-arm64, build-linux-amd64, build-linux-arm64, build-macos-amd64, build-macos-arm64 ]
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download
        uses: actions/download-artifact@v4
        with:
          path: ./dist/
          pattern: artifact-*
          merge-multiple: true

      - name: Generate release.md
        run: |
          version=$(echo "${{ github.ref_name }}" | sed 's/^v//')
          sed "s|VERSION|$version|g" ./.github/release_template.md > release.md

      - name: Rename release assets
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          python3 scripts/rename_release_assets.py "$version"

      - name: Drop checksum sidecars
        shell: bash
        run: |
          set -euo pipefail
          # GitHub already publishes a SHA-256 digest for every release asset,
          # so .sha256 sidecars only doubled the asset list. Packaging tools
          # write some of them into dist, so delete instead of merely skipping
          # generation.
          find ./dist -type f -name '*.sha256' -print -delete

      - name: Release
        if: ${{ env.IS_STABLE == 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          files: ./dist/**/*
          body_path: './release.md'
